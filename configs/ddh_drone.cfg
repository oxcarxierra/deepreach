# DDH experiment: ParameterizedVertDrone2D with data-driven Hamiltonian
# Run: python run_experiment.py --config configs/ddh_drone.cfg

mode = train
experiment_name = ddh_drone_v1
experiment_class = DeepReach

# Dynamics
dynamics_class = ParameterizedVertDrone2D
gravity = 9.81
input_multiplier_max = 4.0
input_magnitude_max = 10.0

# BRT settings
minWith = target
deepreach_model = exact

# DDH settings
use_ddh = True
ddh_num_samples = 5000
ddh_num_controls = 100

# Model architecture
model = sine
model_mode = mlp
num_hl = 3
num_nl = 512

# Training
device = cuda:0
num_epochs = 100000
lr = 2e-5
numpoints = 65000
pretrain = True
pretrain_iters = 2000
tMin = 0.0
tMax = 1.0
counter_start = 0
counter_end = -1
num_src_samples = 1000
num_target_samples = 0
batch_size = 1
clip_grad = 0.0
# use_lbfgs = False
adj_rel_grads = False
dirichlet_loss_divisor = 1.0
lf_eps = 0.0

# Checkpointing / logging
epochs_til_ckpt = 1000
steps_til_summary = 100

# Validation plot resolution
val_x_resolution = 200
val_y_resolution = 200
val_z_resolution = 5
val_time_resolution = 3

# CSL (disabled)
use_CSL = False
CSL_lr = 2e-5
CSL_dt = 0.0025
epochs_til_CSL = 10000
num_CSL_samples = 1000000
CSL_loss_frac_cutoff = 0.1
max_CSL_epochs = 100
CSL_loss_weight = 1.0
CSL_batch_size = 1000
